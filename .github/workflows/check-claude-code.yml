name: Check claude-code floor manifests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - package.json
      - nix/pkgs/claude-code/**
      - .github/workflows/check-claude-code.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix/pkgs/claude-code/update.sh
      - run: |
          git diff --exit-code nix/pkgs/claude-code || {
            echo "::error::the claude-code manifests do not match the @anthropic-ai/claude-code floor in package.json; run nix/pkgs/claude-code/update.sh and commit the result"
            exit 1
          }
