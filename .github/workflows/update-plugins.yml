name: Update plugin inputs

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  # Event-driven bumps (#650): each meridian-plugin-* repo fires this on
  # push to its default branch, so a plugin change lands here immediately
  # instead of up to 24h late. The cron stays as a safety net.
  repository_dispatch:
    types: [plugin-updated]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Bump plugin inputs and verify each still builds
        run: |
          for input in $(nix flake metadata --json | jq -r '.locks.nodes.root.inputs | keys[] | select(startswith("meridian-plugin-"))'); do
            nix flake update "$input"
            nix build ".#meridianPlugins.${input#meridian-plugin-}" --no-link --print-out-paths
          done

      # All changes reach main through PRs. Re-runs update the same branch.
      # A PR opened by GITHUB_TOKEN does not trigger CI automatically, so a
      # maintainer must trigger the required final-head checks before merge.
      # The plugin builds above are an additional gate, not a CI bypass.
      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update plugin flake inputs"
          title: "chore: update plugin flake inputs"
          body: |
            Automated bump of the `meridian-plugin-*` flake inputs.
            Every plugin was rebuilt against its new pin before this PR was
            opened — a failing build blocks the bump entirely.
          branch: chore/update-plugin-inputs
          add-paths: flake.lock
          delete-branch: true
