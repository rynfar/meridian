name: Update plugins

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  # Event-driven runs (#650): each meridian-plugin-* repo fires this on
  # push to its default branch. The cron stays as a safety net.
  repository_dispatch:
    types: [plugin-updated]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Update each plugin to its latest release and verify it still builds
        run: |
          for plugin in nix/pkgs/meridianPlugins/*/; do
            name=$(basename "$plugin")
            nix run --inputs-from . nixpkgs#nix-update -- --flake \
              --version-regex meridian-plugin-"$name"-v'(.*)' \
              legacyPackages.x86_64-linux.meridianPlugins."$name"
            nix build --no-link --print-out-paths .#meridianPlugins."$name"
          done

      # All changes reach main through PRs. Re-runs update the same branch.
      # A PR opened by GITHUB_TOKEN does not trigger CI automatically, so a
      # maintainer must trigger the required final-head checks before merge.
      # The plugin builds above are an additional gate, not a CI bypass.
      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update plugins"
          title: "chore: update plugins"
          body: |
            Automated `nix-update` of the `meridianPlugins` versions and hashes
            to each plugin's latest release. Every plugin was rebuilt at its new
            version before this PR was opened — a failing build blocks the bump
            entirely.
          branch: chore/update-plugins
          add-paths: nix/pkgs/meridianPlugins
          delete-branch: true
